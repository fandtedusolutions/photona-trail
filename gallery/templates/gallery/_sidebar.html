<style>
    /* Import elegant font if not present */
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;800&display=swap');

    .dash-sidebar {
        background: rgba(10, 14, 23, 0.85); /* Deep Obsidian Glass */
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-right: 1px solid rgba(212, 175, 55, 0.15); /* Subtle Gold border */
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.3);
        padding: 0;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        z-index: 50;
        font-family: 'Outfit', sans-serif;
    }
    .dash-sidebar::-webkit-scrollbar { width: 4px; }
    .dash-sidebar::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 4px; }

    .dash-sidebar-logo {
        padding: 2rem 1.75rem;
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        margin-bottom: 1.5rem;
    }

    .dash-sidebar-logo .logo-text {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .dash-nav {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0;
    }

    .dash-nav-item {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 2px 20px;
        padding: 0.85rem 1.25rem;
        text-decoration: none;
        color: #94a3b8;
        font-size: 0.95rem;
        font-weight: 400;
        border-radius: 8px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        letter-spacing: 0.03em;
    }

    .dash-nav-item:hover {
        background: rgba(212, 175, 55, 0.05);
        color: #f3e5ab;
    }

    .dash-nav-item.active {
        background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.02) 100%);
        color: #f3e5ab;
        border-left: 3px solid #d4af37;
        border-radius: 0 8px 8px 0;
        margin-left: 17px;
        font-weight: 500;
        box-shadow: inset 20px 0 30px -20px rgba(212, 175, 55, 0.2);
    }
    
    .dash-nav-item.active .dash-nav-icon,
    .dash-nav-item.active .dash-nav-icon svg {
        color: #d4af37;
    }

    .dash-nav-icon {
        width: 22px;
        height: 22px;
        min-width: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: inherit;
        opacity: 0.8;
    }
    .dash-nav-item.active .dash-nav-icon { opacity: 1; }

    .dash-nav-icon svg {
        width: 18px;
        height: 18px;
        stroke-width: 1.5px;
    }
    @media (max-width: 768px) {
        .dash-sidebar {
            position: fixed;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            width: 280px;
        }
        .dash-sidebar.open {
            transform: translateX(0);
        }
    }
</style>

<aside class="dash-sidebar" id="mobileSidebar">
    <div style="display: flex; justify-content: space-between; align-items: center; padding-right: 1rem;">
        <a href="{% url 'gallery:dashboard' %}" class="dash-sidebar-logo" style="border-bottom: none; margin-bottom: 0;">
            <div style="width: 38px; height: 38px; background: linear-gradient(135deg, #d4af37, #aa7c11); border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);">
                <div style="width: 16px; height: 16px; border: 1.5px solid white; border-radius: 50%; box-sizing: border-box;"></div>
                <div style="width: 4px; height: 4px; background: white; border-radius: 50%; position: absolute; top: 8px; right: 8px;"></div>
            </div>
            <span class="logo-text">Photona</span>
        </a>
        <button class="sidebar-close-btn" onclick="document.getElementById('mobileSidebar').classList.remove('open')" style="background: transparent; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; display: none;">✕</button>
    </div>
    <style>
        @media (max-width: 768px) {
            .sidebar-close-btn { display: block !important; }
        }
    </style>
    <div style="height: 1px; background: rgba(212, 175, 55, 0.1); margin: 0 1.75rem 1.5rem 1.75rem;"></div>


    <nav class="dash-nav">
        <a href="{% url 'gallery:dashboard' %}" class="dash-nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </span>
            Dashboard
        </a>
        <a href="{% url 'gallery:events_list' %}" class="dash-nav-item {% if request.resolver_match.url_name == 'events_list' %}active{% endif %}">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><rect x="8" y="14" width="2" height="2"/><rect x="14" y="14" width="2" height="2"/></svg>
            </span>
            Events
        </a>
        <a href="{% url 'gallery:plans' %}" class="dash-nav-item {% if request.resolver_match.url_name == 'plans' %}active{% endif %}">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            </span>
            Plans
        </a>
        <a href="javascript:void(0)" class="dash-nav-item" onclick="showToast('Downloads page coming soon!', 'info')">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </span>
            Downloads
        </a>
        <a href="javascript:void(0)" class="dash-nav-item" style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 14px;">
                <span class="dash-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </span>
                Pages
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </a>
        <a href="javascript:void(0)" class="dash-nav-item">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            Users
        </a>
        <a href="javascript:void(0)" class="dash-nav-item" style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 14px;">
                <span class="dash-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                </span>
                Billing
                <span style="font-size: 0.65rem; font-weight: 800; background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; line-height: 1; margin-left: 5px; text-transform: uppercase;">New</span>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </a>
        <a href="javascript:void(0)" class="dash-nav-item" onclick="showToast('WhatsApp sharing coming soon!', 'info')">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            </span>
            WhatsApp
        </a>
        <a href="javascript:void(0)" class="dash-nav-item" onclick="showToast('Email sharing coming soon!', 'info')">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            Email
        </a>
        <a href="javascript:void(0)" class="dash-nav-item" style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 14px;">
                <span class="dash-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </span>
                Settings
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </a>
        <a href="javascript:void(0)" class="dash-nav-item">
            <span class="dash-nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </span>
            Enquiries
        </a>
    </nav>

    <div style="padding: 1.5rem 1.25rem;">
        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(212, 175, 55, 0.15); border-radius: 12px; padding: 1.25rem; margin-top: auto; backdrop-filter: blur(10px);">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 14px;">
                    <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #2a2a2a, #111); border: 1px solid #d4af37; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #d4af37; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                        {{ request.user.username|make_list|first|upper|default:"U" }}
                    </div>
                    <div>
                        <div style="font-size: 0.9rem; font-weight: 500; color: #f3e5ab; letter-spacing: 0.02em;">{{ request.user.username|default:"My Account" }}</div>
                        <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.1em;">Administrator</div>
                    </div>
                </div>
                <a href="{% url 'gallery:user_logout' %}" style="color: #64748b; transition: all 0.3s ease; padding: 6px; border-radius: 50%;" onmouseover="this.style.color='#d4af37'; this.style.background='rgba(212,175,55,0.1)';" onmouseout="this.style.color='#64748b'; this.style.background='transparent';" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
            </div>
        </div>
    </div>
</aside>
